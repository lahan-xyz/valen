<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplicity is design — a manifesto for UI designers</title>
  <meta name="description" content="Simplicity is design. A black-and-white manifesto for UI designers, built with Valen." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* [ Paste your exact global CSS here: :root, body, .mono, .kicker, .h2, .sub, .brand, input[type=range], animations, .reveal, .stagger ] */
    /* For brevity, I'm keeping your original <style> block exactly as it was here. */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    :root { --bg: #ffffff; --fg: #000000; --mut: #666666; --line: #e6e6e6; --st-weight: 900; --st-tracking: -0.05em; --st-stroke: 0.75px; --st-leading: 0.92; }
    html.inverted { --bg: #000000; --fg: #ffffff; --mut: #9a9a9a; --line: #1e1e1e; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background .4s ease, color .4s ease; }
    ::selection { background: var(--fg); color: var(--bg); }
    .mono { font-family: 'Space Mono', monospace; }
    .kicker { font-family: 'Space Mono', monospace; font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: var(--mut); margin: 0 0 1.25rem; }
    .h2 { font-size: clamp(2rem, 5vw, 3.25rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin: 0 0 1.5rem; }
    .sub { color: var(--mut); line-height: 1.6; max-width: 55ch; margin: 0; }
    .brand { position: fixed; top: 1.5rem; left: 1.5rem; z-index: 50; font-family: 'Space Mono', monospace; font-size: .7rem; letter-spacing: .25em; color: var(--mut); opacity: 0; animation: fadeIn 1s ease 0.5s forwards; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 1px; background: var(--fg); outline: none; cursor: pointer; margin: 0; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 2px solid var(--fg); transition: transform .2s cubic-bezier(0.16, 1, 0.3, 1); }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }
    input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 2px solid var(--fg); }
    input[type=range]::-moz-range-track { background: var(--fg); height: 1px; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .stagger > *:nth-child(1) { transition-delay: 0.1s; }
    .stagger > *:nth-child(2) { transition-delay: 0.25s; }
    .stagger > *:nth-child(3) { transition-delay: 0.4s; }
    .stagger > *:nth-child(4) { transition-delay: 0.55s; }
  </style>

  <!-- Import Map: Points to local Valen, or swap to CDN if serving locally without it -->
  <script type="importmap">
  {
    "imports": {
      "valen": "/src/valen.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <!-- Entry point for our modular JS -->
  <script type="module" src="src/main.js"></>
</body>
</html>
