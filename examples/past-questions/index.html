<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>JAMB Past Questions & Answers</title>
  
  <script type="importmap">
    {
    "imports": {
      "valen": "/src/valen.js"
      }
    }
  </script>
  
  <link rel="modulepreload" href="/src/valen.js">
  <link rel="modulepreload" href="./src/App.js">
  
  <style>body, #app{ background: #0a0a0f;}</style>
</head>

<body>

  <div id="app">
    <style>
      .app-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0a0a0f; }
      .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #22c55e; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <div class="app-loading">
      <div class="spinner"></div>
      <p style="color: #ccc; margin-top: 16px;">Loading JAMB Past Questions...</p>
    </div>
  </div>
  
  <script src="./src/App.js" type="module"></script>
</body>

</html>
